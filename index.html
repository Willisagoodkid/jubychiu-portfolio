<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juby chiuuuuu studio <3 .</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Inter:wght@900&display=swap" rel="stylesheet">

    <!-- Markdown 解析庫 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0;
            width: 100vw;
            height: 100vh; 
            overflow: hidden; 
            background-color: #6c5b5e;[cite: 1, 2]
            font-family: 'Inter', 'Noto Sans TC', sans-serif;[cite: 1, 2]
            touch-action: none;
        }
        canvas { display: block; }
        
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #6c5b5e; color: #ffffff; display: flex;[cite: 1, 2]
            flex-direction: column;
            justify-content: center; align-items: center; z-index: 999;
            transition: opacity 0.5s; 
        }
        #loader-text { font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 15px; }
        #progress-bar { width: 200px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: #ffffff; transition: width 0.2s; }

        #brand {
            position: absolute; top: 30px; left: 40px; color: #ffffff;
            font-size: 1.2rem; font-weight: bold; letter-spacing: 1px;
            z-index: 10;
            cursor: pointer;
            pointer-events: auto; 
            transition: opacity 0.3s;
        }
        #brand:hover { opacity: 0.7; }

        #audio-toggle {
            position: absolute; top: 25px; right: 40px; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #ffffff; cursor: pointer; z-index: 20;
            transition: all 0.3s ease; pointer-events: auto;
        }
        #audio-toggle svg { width: 22px; height: 22px; fill: currentColor; }

        #ui-layer {
            position: absolute; bottom: 15%; left: 8%; width: 600px; 
            text-align: left; pointer-events: none; color: #ffffff; z-index: 5;
            transition: opacity 0.6s, transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        body.panel-open #ui-layer { transform: translateY(-200px); opacity: 0; }

        #ui-title { 
            font-size: 5.5rem; font-weight: 900; margin: 0; 
            line-height: 0.85; text-transform: uppercase; word-break: break-word; 
        }
        #ui-subtitle {
            font-size: 1.2rem; font-weight: 700; margin: 5px 0 0 0;
            padding-left: 12px; border-left: 4px solid #ffffff; line-height: 1.2;
        }

        #glass-panel {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 85vh; 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 30px 30px 0 0; 
            transform: translateY(100%); 
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); 
            z-index: 100; display: flex; flex-direction: column; align-items: center;
            pointer-events: none;
        }
        #glass-panel.full-open { 
            transform: translateY(0%); 
            background: rgba(42, 32, 34, 0.9); 
            pointer-events: auto;
        }

        .panel-handle { 
            width: 60px; height: 5px; background: rgba(255,255,255,0.4); 
            border-radius: 5px; margin-top: 15px; margin-bottom: 20px; 
            flex-shrink: 0; cursor: pointer; 
        }
        #close-btn { 
            position: absolute; top: 20px; right: 25px; width: 30px; height: 30px; 
            color: white; font-size: 24px; display: none; z-index: 110; cursor: pointer; 
        }
        body.panel-open #close-btn { display: block; }

        .panel-content {
            width: 100%; max-width: 1200px; padding: 0 40px 80px 40px; box-sizing: border-box;
            display: flex; flex-direction: column; gap: 30px; opacity: 0; 
            transition: opacity 0.5s; height: 100%; overflow-y: auto;
            -webkit-overflow-scrolling: touch; touch-action: pan-y;
        }
        #glass-panel.full-open .panel-content { opacity: 1; }

        .panel-left { width: 100%; }
        .panel-title-text { font-size: 3rem; font-weight: 900; color: #ffffff; line-height: 1.1; margin: 0; }

        .panel-right { width: 100%; }
        .detail-text { width: 100%; color: #eeeeee; font-size: 1.05rem; line-height: 1.8; }
        .detail-text img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .detail-text h1, .detail-text h2, .detail-text h3 { color: #ffffff; margin-top: 30px; margin-bottom: 15px; font-weight: 900; }
        .detail-text p { margin-bottom: 20px; }

        @media (min-width: 769px) {
            .panel-content { flex-direction: row; gap: 60px; }
            .panel-left { flex: 1; padding-top: 40px; }
            .panel-right { flex: 2; padding-top: 40px; }
        }
        @media (max-width: 768px) {
            #brand { top: 20px; left: 20px; font-size: 1rem; }
            #audio-toggle { top: 15px; right: 20px; width: 40px; height: 40px; }
            #ui-layer { left: 20px; bottom: 10%; width: calc(100% - 40px); }
            #ui-title { font-size: 3.2rem; }
            .panel-content { padding: 0 20px 60px 20px; }
            .panel-title-text { font-size: 2.2rem; }
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <div id="loader">
        <div id="loader-text">INITIALIZING...</div>
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
    
    <div id="brand">Juby chiuuuuu studio &lt;3 .</div>

    <div id="audio-toggle">
        <svg id="icon-sound-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        <svg id="icon-sound-on" viewBox="0 0 24 24" style="display:none;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77z"/></svg>
    </div>

    <div id="ui-layer">
        <h1 id="ui-title"></h1>
        <div id="ui-subtitle"></div>
    </div>

    <div id="glass-panel">
        <div class="panel-handle"></div>
        <div id="close-btn">✕</div>
        <div class="panel-content">
            <div class="panel-left">
                <div class="panel-title-text" id="detail-panel-title"></div>
            </div>
            <div class="panel-right">
                <div class="detail-text" id="detail-desc"></div>
            </div>
        </div>
    </div>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const RADIUS = 20;            
    const MODEL_FIXED_Y = 1.3;[cite: 1, 2]      
    const CARD_COUNT = 25;        
    const SPACE_COLOR = '#6c5b5e';[cite: 1, 2]

    let scene, camera, renderer;
    let carouselGroup, centerModelGroup, cardMeshes = [], projects = [];
    let targetRotation = 0, currentRotation = 0, currentActiveIndex = -1, activeCardUUID = null, previewIndex = 0;
    let centerModelTargetScale = 2.0;[cite: 1, 2]

    let isMobile = window.innerWidth / window.innerHeight < 1;
    let CAMERA_BASE_Y = isMobile ? 30 : 22;
    let CAMERA_BASE_Z = isMobile ? 115 : 75; // 手機版拉遠 Z 軸，完整容納圓環

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const manager = new THREE.LoadingManager();

    let lights = [], studioEnvMap;
    let isDragging = false, touchStartX = 0, touchStartY = 0, previousTouchX = 0, hasMoved = false;

    init();

    async function init() {
        await fetchData();

        scene = new THREE.Scene();
        scene.background = new THREE.Color(SPACE_COLOR);[cite: 1, 2]
        scene.fog = new THREE.Fog(SPACE_COLOR, 40, 150); 

        camera = new THREE.PerspectiveCamera(isMobile ? 48 : 35, window.innerWidth / window.innerHeight, 0.1, 400);
        camera.position.set(0, CAMERA_BASE_Y, CAMERA_BASE_Z); 
        camera.lookAt(0, isMobile ? 4 : 0, 0);
        
        camera.layers.enable(0);[cite: 1, 2]
        camera.layers.enable(1);[cite: 1, 2]

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));[cite: 1, 2]
        renderer.shadowMap.enabled = true;[cite: 1, 2]
        renderer.shadowMap.type = THREE.VSMShadowMap;[cite: 1, 2]
        document.body.appendChild(renderer.domElement);[cite: 1, 2]

        const pmremGenerator = new THREE.PMREMGenerator(renderer);[cite: 1, 2]
        studioEnvMap = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;[cite: 1, 2]

        setupLightsAndFloor();[cite: 1, 2]

        if (projects.length > 0) {[cite: 1, 2]
            await preloadAllModels();[cite: 1, 2]
            switchPreviewModel(0);[cite: 1, 2]
        }

        createCarousel();[cite: 1, 2]

        window.addEventListener('resize', onWindowResize);[cite: 1, 2]
        window.addEventListener('wheel', onWheel);[cite: 1, 2]
        window.addEventListener('mousemove', onMouseMove);[cite: 1, 2]
        window.addEventListener('click', onClick);[cite: 1, 2]

        // 嚴謹分流：點擊 vs 滑動
        window.addEventListener('touchstart', (e) => { 
            if (currentActiveIndex !== -1) return;
            isDragging = true; 
            hasMoved = false;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            previousTouchX = touchStartX; 
        }, { passive: true });
        
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || currentActiveIndex !== -1) return;
            const deltaX = e.touches[0].clientX - previousTouchX;
            if (Math.abs(e.touches[0].clientX - touchStartX) > 8) {
                hasMoved = true;
            }
            targetRotation += deltaX * 0.007;
            previousTouchX = e.touches[0].clientX;
        }, { passive: true });
        
        window.addEventListener('touchend', (e) => { 
            if (currentActiveIndex !== -1) return;
            isDragging = false; 
            // 若手指移動距離極小，判定為點擊
            if (!hasMoved) {
                const touch = e.changedTouches[0];
                handleRaycast(touch.clientX, touch.clientY);
            }
        });

        setupUIEvents();
        document.getElementById('loader').style.opacity = 0;[cite: 1, 2]
        setTimeout(() => document.getElementById('loader').remove(), 500);

        animate();[cite: 1, 2]
    }

    function setupLightsAndFloor() {
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);[cite: 1, 2]
        ambientLight.layers.set(0);[cite: 1, 2]
        scene.add(ambientLight);[cite: 1, 2]

        const studioAmbient = new THREE.AmbientLight(0xffffff, 2.0);[cite: 1, 2]
        studioAmbient.layers.set(1);[cite: 1, 2]
        scene.add(studioAmbient);[cite: 1, 2]

        const topLight = new THREE.DirectionalLight(0xffffff, 0.5);[cite: 1, 2]
        topLight.position.set(0, 40, 0);[cite: 1, 2]
        topLight.castShadow = true;[cite: 1, 2]
        topLight.shadow.mapSize.width = 512;[cite: 1, 2]
        topLight.shadow.mapSize.height = 512;[cite: 1, 2]
        topLight.shadow.bias = -0.0001;[cite: 1, 2]
        topLight.shadow.radius = 10;[cite: 1, 2]
        topLight.shadow.blurSamples = 10;[cite: 1, 2]
        topLight.layers.enable(0);[cite: 1, 2]
        topLight.layers.enable(1);[cite: 1, 2]
        scene.add(topLight);[cite: 1, 2]

        const colors = [0xffd54f, 0xc084fc, 0xff8a65, 0xf472b6];[cite: 1, 2]
        const intensities = [2500, 2500, 1800, 1800];[cite: 1, 2]
        
        for(let i = 0; i < 4; i++) {
            const light = new THREE.PointLight(colors[i], intensities[i], 200);[cite: 1, 2]
            light.layers.set(0);[cite: 1, 2]
            scene.add(light);[cite: 1, 2]
            lights.push(light);[cite: 1, 2]
        }

        const floorGeo = new THREE.PlaneGeometry(1000, 1000);[cite: 1, 2]
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color(SPACE_COLOR),[cite: 1, 2]
            roughness: 1.0, [cite: 1, 2]
            metalness: 0.0[cite: 1, 2]
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);[cite: 1, 2]
        floor.rotation.x = -Math.PI / 2;[cite: 1, 2]
        floor.position.y = -4.0;[cite: 1, 2]
        floor.receiveShadow = true;[cite: 1, 2]
        floor.layers.set(0);[cite: 1, 2]
        scene.add(floor);[cite: 1, 2]

        centerModelGroup = new THREE.Group();[cite: 1, 2]
        scene.add(centerModelGroup);[cite: 1, 2]
    }

    async function fetchData() {
        const status = document.getElementById('loader-text');[cite: 1, 2]
        status.innerText = "FETCHING DATA...";[cite: 1, 2]
        try {
            const nocache = new Date().getTime();[cite: 1, 2]
            const items = ['a', 'b', 'c', 'd', 'e']; 

            projects = await Promise.all(items.map(async (name, index) => {
                let desc = "";
                let customTitle = name.toUpperCase();[cite: 1, 2]
                
                if (name === 'a') customTitle = "JUBY 2014"; 
                if (name === 'b') customTitle = "JUBY FALL"; 
                if (name === 'c') customTitle = "JUBY DANCE"; 
                if (name === 'd') customTitle = "JUBY STUDIO"; 

                try {
                    let r = await fetch(`txts/${name}.md?t=${nocache}`);
                    if (!r.ok) r = await fetch(`txts/${name}.txt?t=${nocache}`);
                    if (r.ok) desc = await r.text();
                } catch(e){}

                return {
                    id: index,
                    letter: name.toUpperCase(),[cite: 1, 2]
                    title: customTitle, 
                    image: `images/${name}.png?t=${nocache}`, 
                    model: `models/${name}.glb`, 
                    desc: desc,
                    sceneObject: null,[cite: 1, 2]
                    normalizedScale: 1[cite: 1, 2]
                };
            }));
        } catch (e) { console.error(e); }[cite: 1, 2]
    }

    async function preloadAllModels() {
        const loader = new GLTFLoader(manager);[cite: 1, 2]
        const dracoLoader = new DRACOLoader();[cite: 1, 2]
        dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');[cite: 1, 2]
        loader.setDRACOLoader(dracoLoader);[cite: 1, 2]

        const total = projects.length;[cite: 1, 2]
        let loaded = 0;[cite: 1, 2]
        document.getElementById('loader-text').innerText = "LOADING MODELS...";[cite: 1, 2]

        const promises = projects.map((project) => {
            return new Promise((resolve) => {
                loader.load(project.model, (gltf) => {
                    const model = gltf.scene;[cite: 1, 2]
                    
                    model.traverse((node) => {[cite: 1, 2]
                        if (node.isMesh) {[cite: 1, 2]
                            node.castShadow = true;[cite: 1, 2]
                            node.receiveShadow = true;[cite: 1, 2]
                            node.layers.set(1);[cite: 1, 2]

                            if (node.material) {[cite: 1, 2]
                                node.material.envMap = studioEnvMap;[cite: 1, 2]
                                node.material.envMapIntensity = 1.0;[cite: 1, 2]
                                node.material.needsUpdate = true;[cite: 1, 2]
                            }
                        }
                    });
                    
                    const box = new THREE.Box3().setFromObject(model);[cite: 1, 2]
                    const center = new THREE.Vector3();[cite: 1, 2]
                    box.getCenter(center);[cite: 1, 2]
                    model.position.sub(center);[cite: 1, 2]

                    const size = new THREE.Vector3();[cite: 1, 2]
                    box.getSize(size);[cite: 1, 2]
                    const maxDim = Math.max(size.x, size.y, size.z);[cite: 1, 2]
                    project.normalizedScale = 4.0 / maxDim;[cite: 1, 2]

                    model.visible = false;[cite: 1, 2]
                    centerModelGroup.add(model);[cite: 1, 2]
                    project.sceneObject = model;[cite: 1, 2]

                    loaded++;[cite: 1, 2]
                    document.getElementById('progress-fill').style.width = Math.round((loaded / total) * 100) + "%";[cite: 1, 2]
                    resolve();[cite: 1, 2]
                }, undefined, () => resolve());[cite: 1, 2]
            });
        });

        await Promise.all(promises);[cite: 1, 2]
        renderer.compile(scene, camera);[cite: 1, 2]
    }

    function createCarousel() {
        carouselGroup = new THREE.Group();[cite: 1, 2]
        scene.add(carouselGroup);[cite: 1, 2]
        if (projects.length === 0) return;[cite: 1, 2]
        const loader = new THREE.TextureLoader();[cite: 1, 2]

        for (let i = 0; i < CARD_COUNT; i++) {
            const dataIndex = i % projects.length;[cite: 1, 2]
            const project = projects[dataIndex];[cite: 1, 2]
            const angle = (i / CARD_COUNT) * Math.PI * 2;[cite: 1, 2]
            
            const x = Math.sin(angle) * RADIUS;[cite: 1, 2]
            const z = Math.cos(angle) * RADIUS;[cite: 1, 2]

            const geometry = new THREE.PlaneGeometry(3.6, 2.4);[cite: 1, 2]
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x999999,[cite: 1, 2]
                side: THREE.DoubleSide,[cite: 1, 2]
                transparent: true,      [cite: 1, 2]
                opacity: 0.7,          [cite: 1, 2]
                roughness: 0.4,        [cite: 1, 2]
                metalness: 0.2[cite: 1, 2]
            });

            loader.load(
                project.image, 
                (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;[cite: 1, 2]
                    material.map = texture;[cite: 1, 2]
                    material.color.setHex(0xffffff);[cite: 1, 2]
                    material.needsUpdate = true;[cite: 1, 2]
                },
                undefined,[cite: 1, 2]
                (err) => {}[cite: 1, 2]
            );

            const mesh = new THREE.Mesh(geometry, material);[cite: 1, 2]
            mesh.position.set(x, 0, z);[cite: 1, 2]
            mesh.lookAt(0, 0, 0);[cite: 1, 2]
            mesh.rotateY(Math.PI / 2);[cite: 1, 2]
            mesh.layers.set(0);[cite: 1, 2]

            mesh.userData = { 
                id: i,[cite: 1, 2]
                project: project,[cite: 1, 2]
                dataIndex: dataIndex,[cite: 1, 2]
                originalAngle: angle,[cite: 1, 2]
                targetLocalY: 0,  [cite: 1, 2]
                currentLocalY: 0, [cite: 1, 2]
                targetOpacity: 0.7, [cite: 1, 2]
                baseOpacity: 0.7     [cite: 1, 2]
            };
            carouselGroup.add(mesh);[cite: 1, 2]
            cardMeshes.push(mesh);[cite: 1, 2]
        }
    }

    function switchPreviewModel(dataIndex) {
        previewIndex = dataIndex;[cite: 1, 2]
        updateUIText(dataIndex);[cite: 1, 2]
        
        projects.forEach((p, idx) => {[cite: 1, 2]
            if (p.sceneObject) {[cite: 1, 2]
                p.sceneObject.visible = (idx === dataIndex);[cite: 1, 2]
                if (idx === dataIndex) {[cite: 1, 2]
                    p.sceneObject.rotation.y = 0;[cite: 1, 2]
                    p.sceneObject.position.y = MODEL_FIXED_Y;[cite: 1, 2]
                    if (currentActiveIndex === -1) {[cite: 1, 2]
                        centerModelTargetScale = p.normalizedScale * (isMobile ? 1.5 : 2.0);
                    }
                }
            }
        });
    }

    function updateUIText(dataIndex) {
        const p = projects[dataIndex];[cite: 1, 2]
        if(!p) return;[cite: 1, 2]
        document.getElementById('ui-title').innerText = p.letter || "";[cite: 1, 2]
        document.getElementById('ui-subtitle').innerText = p.title || "";[cite: 1, 2]
    }

    function handleRaycast(clientX, clientY) {
        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(cardMeshes);

        if (intersects.length > 0) {
            const hit = intersects[0].object;
            const dataIndex = hit.userData.dataIndex;
            if (currentActiveIndex === dataIndex) return;

            enterDetailMode(hit);
            
            let targetAngle = -hit.userData.originalAngle;
            const currentRot = currentRotation;
            const twoPi = Math.PI * 2;
            const cycles = Math.floor(currentRot / twoPi);
            targetAngle += cycles * twoPi;
            const diff = targetAngle - currentRot;
            if (diff > Math.PI) targetAngle -= twoPi;
            else if (diff < -Math.PI) targetAngle += twoPi;
            targetRotation = targetAngle;
        }
    }

    function enterDetailMode(cardMesh) {
        const dataIndex = cardMesh.userData.dataIndex;[cite: 1, 2]
        currentActiveIndex = dataIndex;[cite: 1, 2]
        switchPreviewModel(dataIndex);[cite: 1, 2]
        
        const p = projects[dataIndex];[cite: 1, 2]
        document.getElementById('detail-panel-title').innerText = p.title;[cite: 1, 2]
        
        document.getElementById('detail-desc').innerHTML = typeof marked !== 'undefined' ? marked.parse(p.desc) : p.desc;
        
        const panel = document.getElementById('glass-panel');[cite: 1, 2]
        panel.classList.add('full-open');
        document.body.classList.add('panel-open');[cite: 1, 2]

        centerModelTargetScale = p.normalizedScale * 2.5;[cite: 1, 2]
        activeCardUUID = cardMesh.uuid;[cite: 1, 2]
        cardMesh.userData.targetLocalY = 50;[cite: 1, 2]
        cardMesh.userData.targetOpacity = 0;[cite: 1, 2]
    }

    function exitDetailMode() {
        currentActiveIndex = -1;[cite: 1, 2]
        document.getElementById('glass-panel').classList.remove('full-open');
        document.body.classList.remove('panel-open');[cite: 1, 2]
        
        const p = projects[previewIndex];[cite: 1, 2]
        if(p) centerModelTargetScale = p.normalizedScale * (isMobile ? 1.5 : 2.0); 
        
        if (activeCardUUID) {[cite: 1, 2]
            const mesh = cardMeshes.find(m => m.uuid === activeCardUUID);[cite: 1, 2]
            if (mesh) {[cite: 1, 2]
                mesh.userData.targetLocalY = 0;[cite: 1, 2]
                mesh.userData.targetOpacity = mesh.userData.baseOpacity;[cite: 1, 2]
            }
        }
        activeCardUUID = null;[cite: 1, 2]
        
        setTimeout(() => {[cite: 1, 2]
            if(currentActiveIndex === -1) {[cite: 1, 2]
                document.getElementById('detail-desc').innerHTML = '';[cite: 1, 2]
            }
        }, 500);[cite: 1, 2]
    }

    function onClick(event) {
        if (currentActiveIndex !== -1) {
            const path = event.composedPath ? event.composedPath() : [];
            const isContent = path.some(el => el.classList && el.classList.contains('panel-content'));
            if (!isContent && event.target.id !== 'audio-toggle') exitDetailMode();
            return;
        }

        handleRaycast(event.clientX, event.clientY);
    }

    function setupUIEvents() {
        document.getElementById('brand').addEventListener('click', (e) => {[cite: 1, 2]
            e.stopPropagation();[cite: 1, 2]
            if (currentActiveIndex !== -1) exitDetailMode();[cite: 1, 2]
        });

        document.getElementById('close-btn').addEventListener('click', exitDetailMode);
        document.querySelector('.panel-handle').addEventListener('click', exitDetailMode);

        const audioBtn = document.getElementById('audio-toggle');[cite: 1, 2]
        const bgMusic = document.getElementById('bg-music');[cite: 1, 2]
        const iconOn = document.getElementById('icon-sound-on');[cite: 1, 2]
        const iconOff = document.getElementById('icon-sound-off');[cite: 1, 2]
        let isPlaying = false;[cite: 1, 2]

        audioBtn.addEventListener('click', (e) => {[cite: 1, 2]
            e.stopPropagation(); [cite: 1, 2]
            if (isPlaying) {[cite: 1, 2]
                bgMusic.pause();[cite: 1, 2]
                iconOn.style.display = 'none';[cite: 1, 2]
                iconOff.style.display = 'block';[cite: 1, 2]
            } else {
                bgMusic.play();[cite: 1, 2]
                iconOn.style.display = 'block';[cite: 1, 2]
                iconOff.style.display = 'none';[cite: 1, 2]
            }
            isPlaying = !isPlaying;[cite: 1, 2]
        });
    }

    function onWindowResize() {
        isMobile = window.innerWidth / window.innerHeight < 1;
        CAMERA_BASE_Y = isMobile ? 30 : 22;
        CAMERA_BASE_Z = isMobile ? 115 : 75;
        
        camera.fov = isMobile ? 48 : 35;
        camera.aspect = window.innerWidth / window.innerHeight;[cite: 1, 2]
        camera.position.set(0, CAMERA_BASE_Y, CAMERA_BASE_Z);
        camera.lookAt(0, isMobile ? 4 : 0, 0);
        camera.updateProjectionMatrix();[cite: 1, 2]
        renderer.setSize(window.innerWidth, window.innerHeight);[cite: 1, 2]
    }

    function onWheel(event) {
        if (currentActiveIndex === -1) {
            targetRotation += event.deltaY * 0.0008;[cite: 1, 2]
        }
    }

    function onMouseMove(event) {
        if (isMobile) return; // 手機版完全凍結視角位移，防止偏斜
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;[cite: 1, 2]
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;[cite: 1, 2]
        
        if (!isDragging && currentActiveIndex === -1) {[cite: 1, 2]
            const targetCamX = -mouse.x * 4; [cite: 1, 2]
            const targetCamY = mouse.y * 4 + CAMERA_BASE_Y;[cite: 1, 2]
            camera.position.x += (targetCamX - camera.position.x) * 0.05;[cite: 1, 2]
            camera.position.y += (targetCamY - camera.position.y) * 0.05;[cite: 1, 2]
            camera.lookAt(0, 0, 0);[cite: 1, 2]
        }
    }

    function animate() {
        requestAnimationFrame(animate);[cite: 1, 2]

        const time = Date.now() * 0.0002; [cite: 1, 2]
        if (lights.length === 4) {[cite: 1, 2]
            lights[0].position.x = Math.sin(time) * 25;[cite: 1, 2]
            lights[0].position.z = Math.cos(time) * 25;[cite: 1, 2]
            lights[0].position.y = 8 + Math.sin(time * 1.5) * 3;[cite: 1, 2]

            lights[1].position.x = Math.sin(time + Math.PI) * 25;[cite: 1, 2]
            lights[1].position.z = Math.cos(time + Math.PI) * 25;[cite: 1, 2]
            lights[1].position.y = 8 - Math.sin(time * 1.5) * 3;[cite: 1, 2]

            lights[2].position.x = Math.cos(time * 1.2) * 15;[cite: 1, 2]
            lights[2].position.z = Math.sin(time * 1.2) * 15;[cite: 1, 2]
            lights[2].position.y = 12 + Math.cos(time * 2) * 2;[cite: 1, 2]

            lights[3].position.x = Math.cos(time * 1.2 + Math.PI) * 15;[cite: 1, 2]
            lights[3].position.z = Math.sin(time * 1.2 + Math.PI) * 15;[cite: 1, 2]
            lights[3].position.y = 12 - Math.cos(time * 2) * 2;[cite: 1, 2]
        }

        currentRotation += (targetRotation - currentRotation) * 0.06;[cite: 1, 2]
        if (carouselGroup) {[cite: 1, 2]
            carouselGroup.rotation.y = currentRotation;[cite: 1, 2]
        }

        cardMeshes.forEach(mesh => {[cite: 1, 2]
            const target = mesh.userData.targetLocalY;[cite: 1, 2]
            mesh.userData.currentLocalY += (target - mesh.userData.currentLocalY) * 0.05;[cite: 1, 2]
            mesh.position.y = mesh.userData.currentLocalY;[cite: 1, 2]
            
            if (mesh.material) {[cite: 1, 2]
                const currentOp = mesh.material.opacity;[cite: 1, 2]
                const targetOp = mesh.userData.targetOpacity;[cite: 1, 2]
                mesh.material.opacity += (targetOp - currentOp) * 0.05;[cite: 1, 2]
            }
        });

        if (currentActiveIndex === -1 && !isMobile) {
            raycaster.setFromCamera(mouse, camera);[cite: 1, 2]
            const intersects = raycaster.intersectObjects(cardMeshes);[cite: 1, 2]
            
            cardMeshes.forEach(mesh => {[cite: 1, 2]
                if (mesh.uuid !== activeCardUUID) {[cite: 1, 2]
                    mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);[cite: 1, 2]
                    mesh.userData.targetOpacity = mesh.userData.baseOpacity; [cite: 1, 2]
                }
            });
            document.body.style.cursor = 'default';[cite: 1, 2]

            if (intersects.length > 0) {[cite: 1, 2]
                const hit = intersects[0].object;[cite: 1, 2]
                const targetIdx = hit.userData.dataIndex;[cite: 1, 2]
                document.body.style.cursor = 'pointer';[cite: 1, 2]
                hit.scale.lerp(new THREE.Vector3(1.3, 1.3, 1.3), 0.15);[cite: 1, 2]
                
                if (hit.uuid !== activeCardUUID) {[cite: 1, 2]
                    hit.userData.targetOpacity = 1.0;[cite: 1, 2]
                }
                
                if (previewIndex !== targetIdx) {[cite: 1, 2]
                    switchPreviewModel(targetIdx);[cite: 1, 2]
                }
            }
        }

        projects.forEach(p => {[cite: 1, 2]
            if (p.sceneObject && p.sceneObject.visible) {[cite: 1, 2]
                p.sceneObject.rotation.y += 0.005;[cite: 1, 2]
                p.sceneObject.position.y = MODEL_FIXED_Y; [cite: 1, 2]

                const currentS = p.sceneObject.scale.x;[cite: 1, 2]
                const nextS = currentS + (centerModelTargetScale - currentS) * 0.05;[cite: 1, 2]
                p.sceneObject.scale.set(nextS, nextS, nextS);[cite: 1, 2]
            }
        });

        renderer.render(scene, camera);[cite: 1, 2]
    }
</script>
