<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juby chiuuuuu studio &lt;3 .</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Inter:wght@900&display=swap" rel="stylesheet">

    <style>
        body { 
            margin: 0; 
            padding: 0;
            width: 100vw;
            height: 100vh; 
            overflow: hidden; 
            background-color: #6c5b5e;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            touch-action: none;
        }
        canvas { display: block; }
        
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #6c5b5e; color: #ffffff; display: flex;
            flex-direction: column;
            justify-content: center; align-items: center; z-index: 999;
            transition: opacity 0.4s ease; 
        }
        #loader-text { font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; }

        #brand {
            position: absolute; top: 30px; left: 40px; color: #ffffff;
            font-size: 1.2rem; font-weight: bold; letter-spacing: 1px;
            z-index: 10; cursor: pointer; pointer-events: auto; 
            transition: opacity 0.3s;
        }
        #brand:hover { opacity: 0.7; }

        #audio-toggle {
            position: absolute; top: 25px; right: 40px; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #ffffff; cursor: pointer; z-index: 200;
            transition: transform 0.2s ease, background 0.3s ease;
            pointer-events: auto;
        }
        #audio-toggle:active { transform: scale(0.9); }
        #audio-toggle svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }

        #ui-layer {
            position: absolute; bottom: 15%; left: 8%; width: 600px; 
            text-align: left; pointer-events: none; color: #ffffff; z-index: 5;
            transition: opacity 0.5s, transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }
        body.panel-open #ui-layer { transform: translateY(-100px); opacity: 0; }

        #ui-title { 
            font-size: 4.5rem; font-weight: 900; margin: 0; 
            line-height: 0.95; text-transform: uppercase; word-break: break-word; 
        }
        #ui-subtitle {
            font-size: 1.2rem; font-weight: 700; margin: 8px 0 0 0;
            padding-left: 12px; border-left: 4px solid #ffffff; line-height: 1.2;
        }

        #glass-panel {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 82vh; 
            background: rgba(255, 255, 255, 0.18); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.35); 
            box-shadow: 0 -15px 50px rgba(0, 0, 0, 0.15);
            border-radius: 28px 28px 0 0; 
            transform: translateY(105%); 
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); 
            z-index: 100; display: flex; flex-direction: column; align-items: center;
            pointer-events: none;
        }
        #glass-panel.full-open { 
            transform: translateY(0%); 
            pointer-events: auto;
        }

        .panel-handle { 
            width: 50px; height: 5px; background: rgba(255,255,255,0.6); 
            border-radius: 5px; margin-top: 14px; margin-bottom: 15px; 
            flex-shrink: 0; cursor: pointer; 
        }
        #close-btn { 
            position: absolute; top: 18px; right: 24px; width: 32px; height: 32px; 
            color: #ffffff; font-size: 22px; display: flex; justify-content: center; align-items: center;
            z-index: 110; cursor: pointer; background: rgba(0,0,0,0.15); border-radius: 50%;
        }

        .panel-content {
            width: 100%; max-width: 1100px; padding: 10px 20px 80px 40px; box-sizing: border-box;
            display: flex; flex-direction: column; gap: 25px; opacity: 0; 
            transition: opacity 0.4s ease; height: 100%; overflow-y: auto;
            -webkit-overflow-scrolling: touch; touch-action: pan-y;
        }
        #glass-panel.full-open .panel-content { opacity: 1; }

        /* ✨ 完美透明、靠邊極簡滾動條設計 */
        .panel-content::-webkit-scrollbar {
            width: 4px;
        }
        .panel-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .panel-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.35);
            border-radius: 4px;
        }
        .panel-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .panel-left { width: 100%; }
        .panel-title-text { font-size: 2.5rem; font-weight: 900; color: #ffffff; line-height: 1.1; margin: 0; }

        .panel-right { width: 100%; }
        
        /* 統一文字大小約束 */
        .detail-text { 
            width: 100%; 
            color: #ffffff; 
            font-size: 0.95rem; 
            line-height: 1.8; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.15); 
        }
        .detail-text img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
            margin: 18px 0; 
            display: block; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
        }
        .detail-text h1, .detail-text h2 { 
            font-size: 1.3rem; 
            font-weight: 900; 
            margin: 0 0 12px 0; 
            color: #ffffff; 
            line-height: 1.4;
        }
        .detail-text p { 
            margin-bottom: 16px; 
            font-size: 0.95rem;
        }

        @media (min-width: 769px) {
            .panel-content { flex-direction: row; gap: 50px; }
            .panel-left { flex: 1; padding-top: 30px; }
            .panel-right { flex: 2; padding-top: 30px; padding-right: 15px; }
        }
        @media (max-width: 768px) {
            #brand { top: 20px; left: 20px; font-size: 1rem; }
            #audio-toggle { top: 15px; right: 20px; width: 40px; height: 40px; }
            #ui-layer { left: 20px; bottom: 12%; width: calc(100% - 40px); }
            #ui-title { font-size: 2.8rem; }
            .panel-content { padding: 10px 15px 60px 20px; }
            .panel-title-text { font-size: 2rem; }
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <audio id="bg-music" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>

    <div id="loader">
        <div id="loader-text">INITIALIZING...</div>
    </div>
    
    <div id="brand">Juby chiuuuuu studio &lt;3 .</div>

    <div id="audio-toggle">
        <svg id="icon-sound-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        <svg id="icon-sound-on" viewBox="0 0 24 24" style="display:none;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77z"/></svg>
    </div>

    <div id="ui-layer">
        <h1 id="ui-title"></h1>
        <div id="ui-subtitle"></div>
    </div>

    <div id="glass-panel">
        <div class="panel-handle"></div>
        <div id="close-btn">✕</div>
        <div class="panel-content">
            <div class="panel-left">
                <div class="panel-title-text" id="detail-panel-title"></div>
            </div>
            <div class="panel-right">
                <div class="detail-text" id="detail-desc"></div>
            </div>
        </div>
    </div>

<script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const RADIUS = 20;            
    const CARD_COUNT = 25;        
    const SPACE_COLOR = '#6c5b5e';

    let scene, camera, renderer;
    let carouselGroup, cardMeshes = [], projects = [];
    let targetRotation = 0, currentRotation = 0, currentActiveIndex = -1, activeCardUUID = null;

    let isMobile = window.innerWidth / window.innerHeight < 1;
    let CAMERA_BASE_Y = isMobile ? 24 : 22;
    let CAMERA_BASE_Z = isMobile ? 85 : 75;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let lights = [], studioEnvMap;
    let ambientLight, topLight;
    let isDragging = false, touchStartTime = 0, touchStartX = 0, touchStartY = 0, previousTouchX = 0;
    
    let parallaxTargetX = 0;
    let parallaxTargetY = 0;

    let audioInitialized = false;

    init();

    async function init() {
        await fetchData();

        scene = new THREE.Scene();
        scene.background = new THREE.Color(SPACE_COLOR);
        scene.fog = new THREE.Fog(SPACE_COLOR, 40, 150); 

        camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 400);
        camera.position.set(0, CAMERA_BASE_Y, CAMERA_BASE_Z); 
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.VSMShadowMap; 
        document.body.appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        studioEnvMap = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        setupLightsAndFloor();
        createCarousel();

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('wheel', onWheel);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('click', onMouseClick);

        window.addEventListener('touchstart', (e) => {
            tryAutoPlayAudio();
            if (currentActiveIndex !== -1) return;
            isDragging = true;
            touchStartTime = Date.now();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            previousTouchX = touchStartX;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || currentActiveIndex !== -1) return;
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            const deltaX = currentX - previousTouchX;
            targetRotation += deltaX * 0.006;
            previousTouchX = currentX;

            parallaxTargetX = ((currentX / window.innerWidth) * 2 - 1) * -3.0;
            parallaxTargetY = -((currentY / window.innerHeight) * 2 - 1) * 3.0;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (currentActiveIndex !== -1) return;
            isDragging = false;
            const touchEndTime = Date.now();
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const moveDist = Math.hypot(touchEndX - touchStartX, touchEndY - touchStartY);

            if (touchEndTime - touchStartTime < 350 && moveDist < 12) {
                performRaycast(touchEndX, touchEndY);
            }
        });

        setupUIEvents();

        const loaderDiv = document.getElementById('loader');
        if (loaderDiv) {
            loaderDiv.style.opacity = '0';
            setTimeout(() => loaderDiv.remove(), 400);
        }

        animate();
    }

    function tryAutoPlayAudio() {
        if (audioInitialized) return;
        const bgMusic = document.getElementById('bg-music');
        if (bgMusic) {
            bgMusic.play().then(() => {
                audioInitialized = true;
                document.getElementById('icon-sound-on').style.display = 'block';
                document.getElementById('icon-sound-off').style.display = 'none';
            }).catch(() => {});
        }
    }

    function setupLightsAndFloor() {
        ambientLight = new THREE.AmbientLight(0xffffff, isMobile ? 3.0 : 1.5);
        scene.add(ambientLight);

        topLight = new THREE.DirectionalLight(0xffffff, isMobile ? 1.0 : 0.5);
        topLight.position.set(0, 40, 0);
        topLight.castShadow = true;
        topLight.shadow.mapSize.width = 512;
        topLight.shadow.mapSize.height = 512;
        topLight.shadow.bias = -0.0001;
        topLight.shadow.radius = 10;
        topLight.shadow.blurSamples = 10;
        scene.add(topLight);

        const colors = [0xffd54f, 0xc084fc, 0xff8a65, 0xf472b6]; 
        const intensities = isMobile ? [5000, 5000, 3600, 3600] : [2500, 2500, 1800, 1800]; 
        
        for(let i = 0; i < 4; i++) {
            const light = new THREE.PointLight(colors[i], intensities[i], 200);
            scene.add(light);
            lights.push(light);
        }

        const floorGeo = new THREE.PlaneGeometry(1000, 1000); 
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color(SPACE_COLOR), 
            roughness: 1.0, 
            metalness: 0.0
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; 
        floor.position.y = -4.0; 
        floor.receiveShadow = true; 
        scene.add(floor);
    }

    async function fetchData() {
        const nocache = new Date().getTime();
        const items = ['a', 'b', 'c', 'd', 'e']; 

        projects = await Promise.all(items.map(async (name, index) => {
            let desc = "";
            let customTitle = "";
            let customSubtitle = "";
            
            if (name === 'a') {
                customTitle = "篝火";
                customSubtitle = "-篝火-";
            } else if (name === 'b') {
                customTitle = "身體實驗場";
                customSubtitle = "【 身體實驗場｜舞作｜關於身體，撕裂 ‧ 新生 ‧ 共融 】";
            } else if (name === 'c') {
                customTitle = "Lücy";
                customSubtitle = "Lücy 金曲新人獎";
            } else if (name === 'd') {
                customTitle = "莫比斯圓環創作公社-2025";
                customSubtitle = "莫比斯圓環創作公社-2025";
            } else if (name === 'e') {
                customTitle = "wannasleep 李奕賢";
                customSubtitle = "wannasleep 李奕賢";
            }

            try {
                const r = await fetch(`txts/${name}.txt?t=${nocache}`);
                if(r.ok) desc = await r.text();
            } catch(e){}

            return {
                id: index,
                title: customTitle, 
                subtitle: customSubtitle,
                image: `images/${name}.png?t=${nocache}`, 
                desc: desc
            };
        }));

        if (projects.length > 0) {
            updateUIText(0);
        }
    }

    function createCarousel() {
        carouselGroup = new THREE.Group();
        scene.add(carouselGroup);
        if (projects.length === 0) return;
        const loader = new THREE.TextureLoader();

        for (let i = 0; i < CARD_COUNT; i++) {
            const dataIndex = i % projects.length;
            const project = projects[dataIndex];
            const angle = (i / CARD_COUNT) * Math.PI * 2;
            
            const x = Math.sin(angle) * RADIUS;
            const z = Math.cos(angle) * RADIUS;

            const geometry = new THREE.PlaneGeometry(3.6, 2.4); 
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x999999, 
                side: THREE.DoubleSide, 
                transparent: true,     
                opacity: 0.75,          
                roughness: 0.4,        
                metalness: 0.2
            });

            loader.load(
                project.image, 
                (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    material.map = texture;
                    material.color.setHex(0xffffff); 
                    material.needsUpdate = true;
                },
                undefined,
                () => {}
            );

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, 0, z);
            mesh.lookAt(0, 0, 0);
            mesh.rotateY(Math.PI / 2); 

            mesh.userData = { 
                id: i, 
                dataIndex: dataIndex, 
                originalAngle: angle,
                targetLocalY: 0,  
                currentLocalY: 0, 
                targetOpacity: 0.75, 
                baseOpacity: 0.75    
            };
            carouselGroup.add(mesh);
            cardMeshes.push(mesh);
        }
    }

    function updateUIText(dataIndex) {
        const p = projects[dataIndex];
        if(!p) return;
        document.getElementById('ui-title').innerText = p.title || "";
        document.getElementById('ui-subtitle').innerText = p.subtitle || ""; 
    }

    function performRaycast(clientX, clientY) {
        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(cardMeshes);

        if (intersects.length > 0) {
            const hit = intersects[0].object;
            const dataIndex = hit.userData.dataIndex;
            enterDetailMode(hit);
            
            let targetAngle = -hit.userData.originalAngle;
            const currentRot = currentRotation;
            const twoPi = Math.PI * 2;
            const cycles = Math.floor(currentRot / twoPi);
            targetAngle += cycles * twoPi;
            const diff = targetAngle - currentRot;
            if (diff > Math.PI) targetAngle -= twoPi;
            else if (diff < -Math.PI) targetAngle += twoPi;
            targetRotation = targetAngle;
        }
    }

    function enterDetailMode(cardMesh) {
        const dataIndex = cardMesh.userData.dataIndex;
        currentActiveIndex = dataIndex;
        updateUIText(dataIndex);
        
        const p = projects[dataIndex];
        document.getElementById('detail-panel-title').innerText = p.title;
        document.getElementById('detail-desc').innerHTML = p.desc;
        
        const panel = document.getElementById('glass-panel');
        panel.classList.add('full-open');
        document.body.classList.add('panel-open');

        activeCardUUID = cardMesh.uuid;
        cardMesh.userData.targetLocalY = 50; 
        cardMesh.userData.targetOpacity = 0; 
    }

    function exitDetailMode() {
        currentActiveIndex = -1;
        document.getElementById('glass-panel').classList.remove('full-open');
        document.body.classList.remove('panel-open');
        
        if (activeCardUUID) {
            const mesh = cardMeshes.find(m => m.uuid === activeCardUUID);
            if (mesh) {
                mesh.userData.targetLocalY = 0; 
                mesh.userData.targetOpacity = mesh.userData.baseOpacity;
            }
        }
        activeCardUUID = null;
        
        setTimeout(() => {
            if(currentActiveIndex === -1) {
                document.getElementById('detail-desc').innerHTML = '';
            }
        }, 400);
    }

    function onMouseClick(event) {
        tryAutoPlayAudio();
        if (currentActiveIndex !== -1) {
            const path = event.composedPath ? event.composedPath() : [];
            const isContent = path.some(el => el.classList && el.classList.contains('panel-content'));
            if (!isContent && event.target.id !== 'audio-toggle') exitDetailMode();
            return;
        }
        performRaycast(event.clientX, event.clientY);
    }

    function setupUIEvents() {
        document.getElementById('brand').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentActiveIndex !== -1) exitDetailMode();
        });

        document.getElementById('close-btn').addEventListener('click', exitDetailMode);
        document.querySelector('.panel-handle').addEventListener('click', exitDetailMode);

        const audioBtn = document.getElementById('audio-toggle');
        const bgMusic = document.getElementById('bg-music');
        const iconOn = document.getElementById('icon-sound-on');
        const iconOff = document.getElementById('icon-sound-off');

        const toggleMusic = (e) => {
            e.stopPropagation();
            audioInitialized = true;
            if (bgMusic.paused) {
                bgMusic.play();
                iconOn.style.display = 'block';
                iconOff.style.display = 'none';
            } else {
                bgMusic.pause();
                iconOn.style.display = 'none';
                iconOff.style.display = 'block';
            }
        };

        audioBtn.addEventListener('click', toggleMusic);
        audioBtn.addEventListener('touchend', toggleMusic);
    }

    function onWindowResize() {
        isMobile = window.innerWidth / window.innerHeight < 1;
        CAMERA_BASE_Y = isMobile ? 24 : 22;
        CAMERA_BASE_Z = isMobile ? 85 : 75;

        if (ambientLight) ambientLight.intensity = isMobile ? 3.0 : 1.5;
        if (topLight) topLight.intensity = isMobile ? 1.0 : 0.5;
        const intensities = isMobile ? [5000, 5000, 3600, 3600] : [2500, 2500, 1800, 1800];
        lights.forEach((l, i) => { l.intensity = intensities[i]; });

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.position.set(0, CAMERA_BASE_Y, CAMERA_BASE_Z);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onWheel(event) {
        if (currentActiveIndex === -1) {
            targetRotation += event.deltaY * 0.0008;
        }
    }

    function onMouseMove(event) {
        if (isMobile) return;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        parallaxTargetX = -mouse.x * 4;
        parallaxTargetY = mouse.y * 4;
    }

    function animate() {
        requestAnimationFrame(animate);

        const time = Date.now() * 0.0002; 
        if (lights.length === 4) {
            lights[0].position.x = Math.sin(time) * 25;
            lights[0].position.z = Math.cos(time) * 25;
            lights[0].position.y = 8 + Math.sin(time * 1.5) * 3;

            lights[1].position.x = Math.sin(time + Math.PI) * 25;
            lights[1].position.z = Math.cos(time + Math.PI) * 25;
            lights[1].position.y = 8 - Math.sin(time * 1.5) * 3;

            lights[2].position.x = Math.cos(time * 1.2) * 15;
            lights[2].position.z = Math.sin(time * 1.2) * 15;
            lights[2].position.y = 12 + Math.cos(time * 2) * 2;

            lights[3].position.x = Math.cos(time * 1.2 + Math.PI) * 15;
            lights[3].position.z = Math.sin(time * 1.2 + Math.PI) * 15;
            lights[3].position.y = 12 - Math.cos(time * 2) * 2;
        }

        if (isDragging) {
            currentRotation += (targetRotation - currentRotation) * 0.2;
        } else {
            currentRotation += (targetRotation - currentRotation) * 0.06;
            if (isMobile) {
                parallaxTargetX += (0 - parallaxTargetX) * 0.05;
                parallaxTargetY += (0 - parallaxTargetY) * 0.05;
            }
        }
        
        if (carouselGroup) {
            carouselGroup.rotation.y = currentRotation;
        }

        // ✨ 增加自然呼吸浮動機制（手機在沒滑動時也會有細膩晃動感）
        if (currentActiveIndex === -1) {
            let autoFloatX = isMobile ? Math.sin(time * 3) * 1.8 : 0;
            let autoFloatY = isMobile ? Math.cos(time * 2.5) * 1.2 : 0;

            const targetCamX = parallaxTargetX + autoFloatX;
            const targetCamY = CAMERA_BASE_Y + parallaxTargetY + autoFloatY;

            camera.position.x += (targetCamX - camera.position.x) * 0.05;
            camera.position.y += (targetCamY - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);
        }

        cardMeshes.forEach(mesh => {
            const target = mesh.userData.targetLocalY;
            mesh.userData.currentLocalY += (target - mesh.userData.currentLocalY) * 0.05;
            mesh.position.y = mesh.userData.currentLocalY;
            
            if (mesh.material) {
                const currentOp = mesh.material.opacity;
                const targetOp = mesh.userData.targetOpacity;
                mesh.material.opacity += (targetOp - currentOp) * 0.05;
            }
        });

        if (currentActiveIndex === -1 && !isMobile) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardMeshes);
            
            cardMeshes.forEach(mesh => {
                if (mesh.uuid !== activeCardUUID) {
                    mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                    mesh.userData.targetOpacity = mesh.userData.baseOpacity; 
                }
            });
            document.body.style.cursor = 'default';

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const targetIdx = hit.userData.dataIndex;
                document.body.style.cursor = 'pointer';
                hit.scale.lerp(new THREE.Vector3(1.3, 1.3, 1.3), 0.15);
                
                if (hit.uuid !== activeCardUUID) {
                    hit.userData.targetOpacity = 1.0;
                }
                updateUIText(targetIdx);
            }
        }

        renderer.render(scene, camera);
    }
</script>
